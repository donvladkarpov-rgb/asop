databaseChangeLog:
  # ВАЖНО: v001-init.sql содержит ВСЮ схему, включая ASOP_TERMINAL_CERTS (раньше в v002).
  # При обновлении с версии, где v002 был отдельным changeset, будет checksum mismatch.
