  carrier-service:
    mem_limit: 256m
    build:
      context: ../../backend/carrier-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: asop
      DB_USER: asop
      DB_PASSWORD: asop
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
