    depends_on:
      crypto-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - asop-net

  minio:
    mem_limit: 512m
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-asop-secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 ${MINIO_ROOT_USER:-asop} ${MINIO_ROOT_PASSWORD:-asop-secret} >/dev/null 2>&1 && mc ready health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - asop-net

  minio-init:
    mem_limit: 128m
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for i in $(seq 1 30); do
          if mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-asop} ${MINIO_ROOT_PASSWORD:-asop-secret} >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; then
            break
          fi
          echo "waiting for minio...";
          sleep 2;
        done &&
        mc mb -p local/asop-sync &&
        mc anonymous set download local/asop-sync &&
        echo "MinIO bucket asop-sync ready (anonymous download)"
    depends_on:
      minio:
        condition: service_started
    networks:
      - asop-net

  orchestrator-service:
    mem_limit: 1g
    build:
      context: ../../backend/orchestrator-service
      dockerfile: Dockerfile
    entrypoint: ["/provision.sh"]
    command: ["java", "-jar", "app.jar"]
    environment:
      <<: *jvm-opts
      SERVICE_NAME: orchestrator-service
      KEY_ALIAS: orchestrator-service
      DNS_NAMES: orchestrator-service
      KEYSTORE_PATH: file:/tmp/certs/orchestrator-service.p12
      TRUSTSTORE_PATH: file:/tmp/certs/truststore.p12
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: asop
      DB_USER: asop
      DB_PASSWORD: asop
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-asop}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-asop-secret}
      S3_BUCKET: asop-sync
      PURGE_ENABLED: "true"
      PURGE_INTERVAL_MS: "3600000"
      PURGE_RETENTION_MONTHS: "6"
    volumes:
      - ./certs/provision.sh:/provision.sh:ro
    depends_on:
      crypto-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - asop-net

  web-admin:
    mem_limit: 128m
    build:
      context: ../../frontend/web-admin
      dockerfile: Dockerfile
    ports:
      - "3000:80"
      - "3443:443"
    environment:
      CRYPTO_URL: https://crypto-service:8081
      PROXY_PROTOCOL: "${PROXY_PROTOCOL:-https}"
    volumes:
      - web_admin_certs:/certs
