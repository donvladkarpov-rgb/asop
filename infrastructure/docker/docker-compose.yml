services:
  # === Infrastructure ===

  postgres:
    mem_limit: 512m
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_DB: asop
      POSTGRES_USER: asop
      POSTGRES_PASSWORD: asop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db-migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asop -d asop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asop-net

  zookeeper:
    mem_limit: 256m
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - asop-net

  kafka:
    mem_limit: 1g
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asop-net

  keycloak:
    mem_limit: 512m
    image: quay.io/keycloak/keycloak:25.0.4
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/asop
      KC_DB_USERNAME: asop
      KC_DB_PASSWORD: asop
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asop-net

  # === Application Services ===

  crypto-service:
    mem_limit: 256m
    build:
      context: ../../backend/crypto-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ROOT_CA_KEYSTORE_PATH: /data/root-ca.p12
      ROOT_CA_KEYSTORE_PASSWORD: changeit
    volumes:
      - crypto_data:/data
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - asop-net

  gateway-service:
    mem_limit: 256m
    build:
      context: ../../backend/gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/asop
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/asop/protocol/openid-connect/certs
      GATEWAY_KEYSTORE_PASSWORD: changeit
      TRUSTSTORE_PASSWORD: changeit
      ASOP_ENV: docker
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      crypto-service:
        condition: service_started
    networks:
      - asop-net

  user-service:
    mem_limit: 256m
    build:
      context: ../../backend/user-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: asop
      DB_USER: asop
      DB_PASSWORD: asop
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_PASSWORD: admin
      BOOTSTRAP_ENABLED: "true"
      BOOTSTRAP_ADMIN_PASSWORD: admin
      SPRING_LIQUIBASE_CHANGE_LOG: file:/db-migrations/user/db.changelog-master.yaml
    volumes:
      - ../db-migrations:/db-migrations
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - asop-net

  terminal-service:
    mem_limit: 256m
    build:
      context: ../../backend/terminal-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: asop
      DB_USER: asop
      DB_PASSWORD: asop
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - asop-net

  session-service:
