  web-admin:
    mem_limit: 64m
    build:
      context: ../../frontend/web-admin
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - asop-net

networks:
  asop-net:
    driver: bridge

volumes:
  postgres_data:
  crypto_data:
