x-jvm-opts: &jvm-opts
  JAVA_TOOL_OPTIONS: >-
    -Djavax.net.ssl.trustStore=/tmp/certs/truststore.p12
    -Djavax.net.ssl.trustStorePassword=changeit
    -Djavax.net.ssl.trustStoreType=PKCS12
    -Dspring.redis.host=redis
    -Dspring.redis.port=6379
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -Dfile.encoding=UTF-8

services:
  # === Infrastructure ===

  postgres:
    mem_limit: 1024m
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_DB: asop
      POSTGRES_USER: asop
      POSTGRES_PASSWORD: asop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-superuser.sql:/docker-entrypoint-initdb.d/01-superuser.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asop -d asop"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asop-net

  liquibase:
    mem_limit: 256m
    image: liquibase/liquibase:4.27
    working_dir: /liquibase/changelog
    command:
      - --changeLogFile=db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/asop
      - --username=asop
      - --password=asop
      - update
    volumes:
      - ../db-migrations:/liquibase/changelog
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asop-net

  certs-init:
    mem_limit: 128m
    build:
      context: ./certs
      dockerfile: Dockerfile.certs-init
    environment:
      CRYPTO_URL: https://crypto-service:8081
    volumes:
      - certs_data:/certs
    depends_on:
      crypto-service:
        condition: service_healthy
    networks:
      - asop-net

  zookeeper:
    mem_limit: 256m
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    #ports:
    #  - "2181:2181"
    networks:
      - asop-net

  kafka:
    mem_limit: 1024m
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SSL://kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,SSL://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SSL:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka_keystore_cred
      KAFKA_SSL_KEY_CREDENTIALS: kafka_sslkey_cred
      KAFKA_SSL_TRUSTSTORE_FILENAME: truststore.p12
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka_truststore_cred
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
    #ports:
    #  - "9093:9093"
    volumes:
      - certs_data:/etc/kafka/secrets:ro
    depends_on:
      zookeeper:
        condition: service_started
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asop-net

  keycloak:
    mem_limit: 512m
    image: quay.io/keycloak/keycloak:25.0.4
    command:
      - "start-dev"
      - "--import-realm"
      - "--https-key-store-file=/certs/keycloak.p12"
      - "--https-key-store-password=changeit"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/asop
      KC_DB_USERNAME: asop
      KC_DB_PASSWORD: asop
      KC_HOSTNAME: localhost
      KC_PROXY: edge
      KC_HTTPS_PORT: 8443
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8443:8443"
    volumes:
      - certs_data:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - asop-net

  # === Application Services ===

  # ВНИМАНИЕ: порты backend-сервисов закрыты наружу. Доступ только через gateway (8080).
  # Для dev-доступа к конкретному сервису раскомментируйте его секцию ports.

  crypto-service:
    mem_limit: 512m
    build:
      context: ../../backend/crypto-service
      dockerfile: Dockerfile
    #ports:
    #  - "8081:8081"
    entrypoint: ["/provision.sh"]
    command: ["java", "-jar", "app.jar"]
    environment:
      <<: *jvm-opts
      SERVICE_NAME: crypto-service
      KEY_ALIAS: crypto-service
      DNS_NAMES: crypto-service,localhost
      KEYSTORE_PATH: file:/data/server.p12
      TRUSTSTORE_PATH: file:/tmp/certs/truststore.p12
      SERVER_KEYSTORE_PATH: file:/data/server.p12
      SERVER_KEYSTORE_PASSWORD: changeit
      INTERMEDIATE_CA_KEYSTORE_PATH: /data/intermediate-ca.p12
      INTERMEDIATE_CA_KEYSTORE_PASSWORD: changeit
      ROOT_CA_KEYSTORE_PATH: /data/root-ca.p12
      ROOT_CA_KEYSTORE_PASSWORD: changeit
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9093}
    volumes:
      - ./certs/provision.sh:/provision.sh:ro
      - crypto_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - asop-net

  redis:
    mem_limit: 256m
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asop-net

  gateway-service:
    mem_limit: 2048m
    build:
      context: ../../backend/gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    entrypoint: ["/provision.sh"]
    command: ["java", "-jar", "app.jar"]
    environment:
      <<: *jvm-opts
      SERVICE_NAME: gateway
      KEY_ALIAS: gateway
      DNS_NAMES: localhost,gateway
      KEYSTORE_PATH: file:/tmp/certs/gateway.p12
      TRUSTSTORE_PATH: file:/tmp/certs/truststore.p12
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/asop}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/asop/protocol/openid-connect/certs}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9093}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      ASOP_ENV: docker
    volumes:
      - ./certs/provision.sh:/provision.sh:ro
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      crypto-service:
        condition: service_healthy
    networks:
      - asop-net

  user-service:
    mem_limit: 256m
    build:
      context: ../../backend/user-service
      dockerfile: Dockerfile
    #ports:
    #  - "8082:8082"
    entrypoint: ["/provision.sh"]
    command: ["java", "-jar", "app.jar"]
    environment:
      <<: *jvm-opts
      SERVICE_NAME: user-service
      KEY_ALIAS: user-service
      DNS_NAMES: user-service
      KEYSTORE_PATH: file:/tmp/certs/user-service.p12
      TRUSTSTORE_PATH: file:/tmp/certs/truststore.p12
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: asop
      DB_USER: asop
      DB_PASSWORD: asop
      KEYCLOAK_URL_INTERNAL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8080/realms/asop}
      BOOTSTRAP_ENABLED: "true"
      BOOTSTRAP_ADMIN_PASSWORD: admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9093}
    volumes:
      - ./certs/provision.sh:/provision.sh:ro
    depends_on:
      crypto-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - asop-net

