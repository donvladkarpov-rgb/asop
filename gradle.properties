# Gradle
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# \u0423\u041C\u0415\u041D\u042C\u0428\u0410\u0415\u041C \u043F\u0430\u043C\u044F\u0442\u044C Gradle daemon \u0434\u043E 1.5GB (\u0431\u044B\u043B\u043E 2GB)
org.gradle.jvmargs=-Xmx1536m -XX:+UseG1GC -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Dconsole.encoding=UTF-8
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8

# Kotlin \u2014 \u041E\u0422\u041A\u041B\u042E\u0427\u0410\u0415\u041C daemon \u043F\u043E\u043B\u043D\u043E\u0441\u0442\u044C\u044E
kotlin.code.style=official
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx256m

