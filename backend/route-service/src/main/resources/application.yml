server:
  port: 8092
  ssl:
    enabled: true
    key-store: ${KEYSTORE_PATH:/tmp/certs/route-service.p12}
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${KEY_ALIAS:service}
    trust-store: ${TRUSTSTORE_PATH:/tmp/certs/truststore.p12}
    trust-store-password: ${TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12

spring:
  application:
    name: route-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_PATH:file:/tmp/certs/truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:changeit}
      trust-store-type: PKCS12
    properties:
      security.protocol: SSL
    consumer:
      group-id: route-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

asop:
  topics:
    route-events: asop.route.events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
