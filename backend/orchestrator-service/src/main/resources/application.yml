server:
  port: 8094
  shutdown: graceful
  ssl:
    enabled: true
    key-store: ${KEYSTORE_PATH:/tmp/certs/orchestrator-service.p12}
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${KEY_ALIAS:service}
    trust-store: ${TRUSTSTORE_PATH:/tmp/certs/truststore.p12}
    trust-store-password: ${TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12

spring:
  application:
    name: orchestrator-service

  # Redis (reactive) — chunk store + shared EventService (asop-common)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false

  # Kafka consumer (asop.delta.commands / asop.delta.full.commands)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9093}
    ssl:
      key-store-location: ${KAFKA_KEYSTORE_PATH:file:/tmp/certs/orchestrator-service.p12}
      key-store-password: ${KAFKA_KEYSTORE_PASSWORD:changeit}
      trust-store-location: ${KAFKA_TRUSTSTORE_PATH:file:/tmp/certs/truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:changeit}
    properties:
      security.protocol: SSL
      ssl.endpoint.identification.algorithm: ""
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: orchestrator
      auto-offset-reset: earliest

  # R2DBC — только для purge-job (physical delete soft-deleted rows)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}

# ASOP custom properties
asop:
  kafka:
    topics:
      delta-commands: asop.delta.commands
      delta-full-commands: asop.delta.full.commands
  s3:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:asop}
    secret-key: ${S3_SECRET_KEY:asop-secret}
    bucket: ${S3_BUCKET:asop-sync}
  purge:
    enabled: ${PURGE_ENABLED:true}
    interval-ms: ${PURGE_INTERVAL_MS:3600000}
    retention-months: ${PURGE_RETENTION_MONTHS:6}

# Logging
logging:
  level:
    root: INFO
    ru.asop: DEBUG
    org.springframework.data.r2dbc: INFO
    io.netty: WARN
    reactor.netty: WARN
    org.apache.kafka: WARN

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
