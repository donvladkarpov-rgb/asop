server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: crypto-service

  jackson:
    serialization:
      write-dates-as-timestamps: false

# Настройки Root CA
asop:
  crypto:
    root-ca:
      keystore-path: ${ROOT_CA_KEYSTORE_PATH:./data/root-ca.p12}
      keystore-password: ${ROOT_CA_KEYSTORE_PASSWORD:changeit}
      key-alias: asop-root-ca
      validity-years: 10
      dn: "CN=ASOP Root CA, O=ASOP, C=RU"

    intermediate-ca:
      validity-years: 5
      dn: "CN=ASOP Intermediate CA, O=ASOP, C=RU"

    terminal-cert:
      validity-years: 1
      dn-template: "CN={terminalSerial}, OU={carrierId}, O=ASOP"

    driver-cert:
      validity-years: 1
      dn-template: "CN={driverId}, OU={carrierId}, O=ASOP"

    smart-card-cert:
      validity-years: 1
      # DN-шаблоны для разных ролей смарт-карт
      dn-templates:
        DRIVER: "CN={cardId}, OU=DRIVER:{carrierId}, O=ASOP"
        CONTROLLER: "CN={cardId}, OU=CONTROLLER:{carrierId}, O=ASOP"
        PASSENGER_BENEFIT: "CN={cardId}, OU=PASSENGER:{carrierId}, O=ASOP"
        DISTRIBUTOR_TERMINAL: "CN={cardId}, OU=DISTRIBUTOR:{carrierId}, O=ASOP"
        CARRIER_ADMIN: "CN={cardId}, OU=CARRIER_ADMIN:{carrierId}, O=ASOP"
        REGION_ADMIN: "CN={cardId}, OU=REGION_ADMIN:{carrierId}, O=ASOP"
        SUPER_ADMIN: "CN={cardId}, OU=SUPER_ADMIN, O=ASOP"
        DISPATCHER: "CN={cardId}, OU=DISPATCHER:{carrierId}, O=ASOP"
        DISTRIBUTOR_ADMIN: "CN={cardId}, OU=DISTRIBUTOR_ADMIN:{carrierId}, O=ASOP"
        SERVICE: "CN={cardId}, OU=SERVICE:{carrierId}, O=ASOP"
        DEFAULT: "CN={cardId}, OU={role}, O=ASOP"

    crl:
      crl-path: ${CRL_PATH:./data/root-ca.crl}
      validity-days: 30

logging:
  level:
    root: INFO
    ru.asop.crypto: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
