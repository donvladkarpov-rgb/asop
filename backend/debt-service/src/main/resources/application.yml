server:
  port: 8088
  ssl:
    enabled: true
    key-store: ${KEYSTORE_PATH:/tmp/certs/debt-service.p12}
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${KEY_ALIAS:service}
    trust-store: ${TRUSTSTORE_PATH:/tmp/certs/truststore.p12}
    trust-store-password: ${TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12

spring:
  application:
    name: debt-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}

  liquibase:
    enabled: false
    change-log: file:./infrastructure/db-migrations/debt/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/asop}/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_PATH:file:/tmp/certs/truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:changeit}
    properties:
      security.protocol: SSL
    consumer:
      group-id: debt-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

asop:
  kafka:
    topics:
      debt-commands: asop.debt.commands
      debt-events: asop.debt.events
