server:
  port: 8082

spring:
  application:
    name: user-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}
    hikari:
      maximum-pool-size: 2

  liquibase:
    enabled: true
    change-log: file:./infrastructure/db-migrations/user/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/asop/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_URL:http://keycloak:8080}/realms/asop

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

asop:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@asop.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    admin-last-name-initial: A

  keycloak:
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: asop
    admin-user: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
