server:
  port: 8082
  ssl:
    enabled: true
    key-store: ${KEYSTORE_PATH:/tmp/certs/user-service.p12}
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${KEY_ALIAS:service}
    trust-store: ${TRUSTSTORE_PATH:/tmp/certs/truststore.p12}
    trust-store-password: ${TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12

spring:
  application:
    name: user-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}
    hikari:
      maximum-pool-size: 2

  liquibase:
    enabled: true
    change-log: file:./infrastructure/db-migrations/user/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/asop/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/asop}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_PATH:file:/tmp/certs/truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:changeit}
    properties:
      security.protocol: SSL

asop:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@asop.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    admin-last-name-initial: A

  keycloak:
    url: ${KEYCLOAK_URL_INTERNAL:http://keycloak:8080}
    realm: asop
    admin-user: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
