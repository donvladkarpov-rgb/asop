server:
  port: 8093
  ssl:
    enabled: true
    key-store: ${KEYSTORE_PATH:/tmp/certs/payment-service.p12}
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${KEY_ALIAS:service}
    trust-store: ${TRUSTSTORE_PATH:/tmp/certs/truststore.p12}
    trust-store-password: ${TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12

spring:
  application:
    name: payment-service

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asop}
    username: ${DB_USER:asop}
    password: ${DB_PASSWORD:asop}

  liquibase:
    enabled: false
    change-log: file:./infrastructure/db-migrations/migrations/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/asop}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    ssl:
      trust-store-location: ${KAFKA_TRUSTSTORE_PATH:file:/tmp/certs/truststore.p12}
      trust-store-password: ${KAFKA_TRUSTSTORE_PASSWORD:changeit}
    properties:
      security.protocol: SSL
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Банковский эквайринг.
# provider=mock — MockAcquirerAdapter (dev/test, без сети банка).
# provider=vtb  — VtbSirposAdapter (интерфейс ВТБ, TBD).
asop:
  acquirer:
    provider: ${ASOP_ACQUIRER_PROVIDER:mock}
    mock:
      latency-ms: ${ASOP_ACQUIRER_MOCK_LATENCY_MS:0}
      approve-code: "00"
      decline-code: "05"
      defer-code: "74"
      reauth-code: "76"
      timeout-next-retry-seconds: 60
  kafka:
    topics:
      payment-commands: asop.payment.commands
      payment-events: asop.payment.events
