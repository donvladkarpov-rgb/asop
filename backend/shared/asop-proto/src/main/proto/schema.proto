// Один дельта-чанк: записи из разных таблиц + метаданные чанка.
message DeltaChunk {
  repeated RegionsRow asop_regions = 1;
  repeated TerritoriesRow asop_territories = 2;
  repeated OrganizersRow asop_organizers = 3;
  repeated OrganizerTerritoriesRow asop_organizer_territories = 4;
  repeated RolesRow asop_roles = 5;
  repeated CardTypesRow asop_card_types = 6;
  repeated TariffTypesRow asop_tariff_types = 7;
  repeated SessionTypesRow asop_session_types = 8;
  repeated EventTypesRow asop_event_types = 9;
  repeated TransactionTypesRow asop_transaction_types = 10;
  repeated TransactionResultsRow asop_transaction_results = 11;
  repeated ServicesRow asop_services = 12;
  repeated BenefitsRow asop_benefits = 13;
  repeated BenefitStepsRow asop_benefit_steps = 14;
  repeated CarriersRow asop_carriers = 15;
  repeated ContractsRow asop_contracts = 16;
  repeated ContractRoutesRow asop_contract_routes = 17;
  repeated VehicleTypesRow asop_vehicle_types = 18;
  repeated VehicleModelsRow asop_vehicle_models = 19;
  repeated VehiclesRow asop_vehicles = 20;
  repeated UsersRow asop_users = 21;
  repeated UserRolesRow asop_user_roles = 22;
  repeated UserCarriersRow asop_user_carriers = 23;
  repeated UserRegionsRow asop_user_regions = 24;
  repeated FareZonesRow asop_fare_zones = 25;
  repeated TransportStopsRow asop_transport_stops = 26;
  repeated RoutesRow asop_routes = 27;
  repeated PathsRow asop_paths = 28;
  repeated PathTransportStopsRow asop_path_transport_stops = 29;
  repeated ScheduleRow asop_schedule = 30;
  repeated PathServicesRow asop_path_services = 31;
  repeated PathDiscountsRow asop_path_discounts = 32;
  repeated PathBenefitsRow asop_path_benefits = 33;
  repeated CardsRow asop_cards = 34;
  repeated CardMifaresRow asop_card_mifares = 35;
  repeated CardBanksRow asop_card_banks = 36;
  repeated CardTariffsRow asop_card_tariffs = 37;
  repeated BlacklistsRow asop_blacklists = 38;
  repeated UserBenefitsRow asop_user_benefits = 39;
  repeated TariffRatesRow asop_tariff_rates = 40;
  repeated TidsRow asop_tids = 41;
  repeated CardsDistributorsRow asop_cards_distributors = 42;
  int32 chunk_index = 90;
  int32 total_chunks = 91;
  string event_id = 92;
}

// Файлы полной выгрузки (file-per-table внутри ZIP).
message RegionsFile { repeated RegionsRow rows = 1; }
message TerritoriesFile { repeated TerritoriesRow rows = 1; }
message OrganizersFile { repeated OrganizersRow rows = 1; }
message OrganizerTerritoriesFile { repeated OrganizerTerritoriesRow rows = 1; }
message RolesFile { repeated RolesRow rows = 1; }
message CardTypesFile { repeated CardTypesRow rows = 1; }
message TariffTypesFile { repeated TariffTypesRow rows = 1; }
message SessionTypesFile { repeated SessionTypesRow rows = 1; }
message EventTypesFile { repeated EventTypesRow rows = 1; }
message TransactionTypesFile { repeated TransactionTypesRow rows = 1; }
message TransactionResultsFile { repeated TransactionResultsRow rows = 1; }
message ServicesFile { repeated ServicesRow rows = 1; }
message BenefitsFile { repeated BenefitsRow rows = 1; }
message BenefitStepsFile { repeated BenefitStepsRow rows = 1; }
message CarriersFile { repeated CarriersRow rows = 1; }
message ContractsFile { repeated ContractsRow rows = 1; }
message CardsDistributorsFile { repeated CardsDistributorsRow rows = 1; }
message ContractRoutesFile { repeated ContractRoutesRow rows = 1; }
message VehicleTypesFile { repeated VehicleTypesRow rows = 1; }
message VehicleModelsFile { repeated VehicleModelsRow rows = 1; }
message VehiclesFile { repeated VehiclesRow rows = 1; }
message UsersFile { repeated UsersRow rows = 1; }
message UserRolesFile { repeated UserRolesRow rows = 1; }
message UserCarriersFile { repeated UserCarriersRow rows = 1; }
message UserRegionsFile { repeated UserRegionsRow rows = 1; }
message FareZonesFile { repeated FareZonesRow rows = 1; }
message TransportStopsFile { repeated TransportStopsRow rows = 1; }
message RoutesFile { repeated RoutesRow rows = 1; }
message PathsFile { repeated PathsRow rows = 1; }
message PathTransportStopsFile { repeated PathTransportStopsRow rows = 1; }
message ScheduleFile { repeated ScheduleRow rows = 1; }
message PathServicesFile { repeated PathServicesRow rows = 1; }
message PathDiscountsFile { repeated PathDiscountsRow rows = 1; }
message PathBenefitsFile { repeated PathBenefitsRow rows = 1; }
message CardsFile { repeated CardsRow rows = 1; }
message CardMifaresFile { repeated CardMifaresRow rows = 1; }
message CardBanksFile { repeated CardBanksRow rows = 1; }
message CardTariffsFile { repeated CardTariffsRow rows = 1; }
message BlacklistsFile { repeated BlacklistsRow rows = 1; }
message UserBenefitsFile { repeated UserBenefitsRow rows = 1; }
message TariffRatesFile { repeated TariffRatesRow rows = 1; }
message TidsFile { repeated TidsRow rows = 1; }

