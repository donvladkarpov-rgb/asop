syntax = "proto3";

package asop.v1;
option java_package = "ru.asop.proto.v1";
option java_multiple_files = true;

// Generated from the ASOP database schema (42 delta-sync reference tables).
// Timestamps are RFC3339 strings; UUIDs are canonical string form.

message RegionsRow {
  string region_id = 1;
  string municipal_division = 2;
  string admin_division = 3;
  string federal_district = 4;
  string ifns_fl_code = 5;
  string ifns_ul_code = 6;
  string okato_code = 7;
  string oktmo_code = 8;
  string oktmo_budget_code = 9;
  string fias_id = 10;
  string registry_record_id = 11;
  string timezone = 12;
  string created_at = 13;
  string updated_at = 14;
  string deleted_at = 15;
  int64 version = 16;
}

message TerritoriesRow {
  string territory_id = 1;
  string region_id = 2;
  string municipal_division = 3;
  string admin_division = 4;
  string federal_district = 5;
  string ifns_fl_code = 6;
  string ifns_ul_code = 7;
  string okato_code = 8;
  string oktmo_code = 9;
  string oktmo_budget_code = 10;
  string fias_id = 11;
  string registry_record_id = 12;
  string geo_polygon = 13;
  string created_at = 14;
  string updated_at = 15;
  string deleted_at = 16;
  int64 version = 17;
}

